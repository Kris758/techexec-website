<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Léonce Mfg Kiosk</title>
    <style>
        /* Basic Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Fluid scaling: use clamp(min, preferred, max) for all screen sizes */
        html {
            font-size: clamp(14px, 1.2vw + 12px, 18px);
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #151515;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            color: #f5f5f5;
            padding: clamp(60px, 12vh, 100px) 4vw 2rem;
        }

        /* --- TOP BAR: scales down on tablet/small screens --- */
        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: clamp(8px, 1.5vw, 20px) clamp(12px, 2.5vw, 30px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            background-color: transparent;
            min-height: 0;
        }

        .top-logo {
            height: clamp(44px, 10vh, 130px);
            max-height: 20vh;
            width: auto;
            max-width: 45vw;
            object-fit: contain;
            object-position: right center;
        }

        #live-clock {
            font-size: clamp(1rem, 2.5vw + 0.5rem, 2rem);
            font-weight: 700;
            color: #f9f9f9;
            font-variant-numeric: tabular-nums;
            flex-shrink: 0;
        }

        .top-logo-placeholder {
            font-weight: bold;
            color: #888;
            border: 2px dashed #ccc;
            padding: 10px 20px;
            border-radius: 8px;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        header {
            margin-bottom: clamp(20px, 4vh, 40px);
            text-align: center;
            padding: 0 8px;
        }

        header img {
            max-width: min(320px, 85vw);
            height: auto;
            margin-bottom: 20px;
        }

        h1 {
            color: #f5f5f5;
            font-size: clamp(1.25rem, 4vw + 0.5rem, 2.6rem);
            margin-bottom: clamp(6px, 1vh, 12px);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            line-height: 1.2;
        }

        p {
            color: #c2c2c2;
            font-size: clamp(0.9rem, 1.5vw + 0.5rem, 1.15rem);
        }

        .kiosk-container {
            display: flex;
            gap: clamp(16px, 3vw, 36px);
            width: 90%;
            max-width: min(960px, 95vw);
            justify-content: center;
            flex-wrap: wrap;
        }

        .kiosk-card {
            background: radial-gradient(circle at top, #232323 0, #181818 55%, #101010 100%);
            border-radius: clamp(14px, 2vw, 22px);
            box-shadow: 0 22px 40px rgba(0, 0, 0, 0.65);
            text-decoration: none;
            color: #f5f5f5;
            flex: 1;
            min-width: min(280px, 85vw);
            padding: clamp(20px, 3vw, 40px) clamp(16px, 2.5vw, 32px);
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.18s ease-out, box-shadow 0.18s ease-out, border-color 0.18s ease-out, background-color 0.18s ease-out;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .kiosk-card.employees {
            border-top: 4px solid #f4c430;
        }

        .kiosk-card.visitors {
            border-top: 4px solid #1f6feb;
        }

        .kiosk-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 26px 52px rgba(0, 0, 0, 0.8);
            background: radial-gradient(circle at top, #2a2a2a 0, #1b1b1b 55%, #111 100%);
        }

        .kiosk-card:active {
            transform: translateY(-1px) scale(0.99);
            box-shadow: 0 14px 28px rgba(0, 0, 0, 0.6);
        }

        .kiosk-card.employees:hover {
            border-top-color: #ffe47a;
        }

        .kiosk-card.visitors:hover {
            border-top-color: #4a8dff;
        }

        .kiosk-icon {
            width: clamp(70px, 12vw, 140px);
            height: clamp(70px, 12vw, 140px);
            object-fit: contain;
            margin-bottom: clamp(12px, 2vw, 26px);
            background: radial-gradient(circle at top, #252525 0, #131313 60%, #0b0b0b 100%);
            border-radius: 50%;
            padding: clamp(10px, 1.5vw, 18px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .kiosk-card h2 {
            font-size: clamp(1rem, 2.2vw + 0.5rem, 1.9rem);
            margin-bottom: clamp(4px, 0.5vh, 8px);
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .kiosk-card span {
            font-size: clamp(0.8rem, 1.2vw + 0.4rem, 1.05rem);
            color: #b8b8b8;
        }

        .powered-by {
            position: fixed;
            right: clamp(12px, 1.5vw, 24px);
            bottom: clamp(8px, 1vh, 16px);
            font-size: clamp(0.65rem, 1vw, 0.8rem);
            color: rgba(255, 255, 255, 0.65);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            pointer-events: none;
        }

        /* Tablet: ensure content doesn't push top bar */
        @media (max-width: 1024px) {
            body {
                justify-content: flex-start;
                padding-top: clamp(70px, 14vh, 90px);
            }

            .top-bar {
                padding: clamp(6px, 1vh, 12px) clamp(10px, 2vw, 20px);
            }

            .top-logo {
                height: clamp(40px, 8vh, 80px);
            }

            #live-clock {
                font-size: clamp(0.9rem, 2vw, 1.35rem);
            }

            .kiosk-container {
                gap: clamp(12px, 2vw, 24px);
                max-width: min(540px, 92vw);
            }

            .kiosk-card {
                padding: clamp(16px, 2.5vw, 28px) clamp(14px, 2vw, 24px);
            }
        }

        /* Vertical layout for portrait / small tablets */
        @media (max-width: 768px) {
            .kiosk-container {
                flex-direction: column;
                max-width: min(400px, 92vw);
            }

            .kiosk-card {
                min-width: 0;
                width: 100%;
            }
        }

        /* Small phones */
        @media (max-width: 480px) {
            .top-logo {
                max-width: 50vw;
            }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div id="live-clock">--:-- --</div>
        <img
            class="top-logo"
            src="https://website-6a7daec2.cgs.lvm.mybluehost.me/html_public/content/L%c3%a9once%20Manufacturing.png"
            alt="Leonce Manufacturing Logo"
        >
    </div>

    <header>
        <h1>Welcome to Léonce Manufacturing</h1>
        <p>Please select an option below</p>
    </header>

    <div class="kiosk-container">
       
        <a href="https://leoncemfg.odoo.com/hr_attendance/3f90d011-7cb3-478b-8aea-eae813760cbc" class="kiosk-card employees">
            <img src="https://placehold.co/150/F4C430/000000?text=Staff" alt="Employee Icon" class="kiosk-icon">
            <h2>Employees</h2>
            <span>Clock In / Out</span>
        </a>

        <a href="https://leoncemfg.odoo.com/kiosk/1/47a3d816-27db-4d38-8e50-e72f823cb7b9" class="kiosk-card visitors">
            <img src="https://placehold.co/150/1F6FEB/FFFFFF?text=Visitor" alt="Visitor Icon" class="kiosk-icon">
            <h2>Visitors</h2>
            <span>Guest Check-In</span>
        </a>

    </div>

    <div class="powered-by">powered by TechExec</div>

    <script>
        function updateTime() {
            const now = new Date();
            const timeString = now.toLocaleTimeString([], { 
                hour: '2-digit', 
                minute: '2-digit'
            });
            document.getElementById('live-clock').innerText = timeString;
        }
        
        setInterval(updateTime, 1000); // Update every second
        updateTime(); // Run immediately on load
    </script>

</body>
</html>
